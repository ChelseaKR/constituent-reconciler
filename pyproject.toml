[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "constituent-reconciler"
version = "0.3.0"
description = "Offline-first pipeline that resolves and deduplicates nonprofit constituent records with a human review gate."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Chelsea Kelly-Reif" }]
keywords = [
  "nonprofit",
  "record-linkage",
  "deduplication",
  "entity-resolution",
  "data-intake",
  "human-services",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "splink>=4.0,<5",
]

[project.scripts]
reconcile = "constituent_reconciler.cli:main"

[project.optional-dependencies]
extract = ["pdfplumber>=0.11"]
dev = ["pytest>=8", "mypy>=1.8", "ruff>=0.5", "pdfplumber>=0.11"]

[project.urls]
Homepage = "https://github.com/ChelseaKR/constituent-reconciler"
Documentation = "https://github.com/ChelseaKR/constituent-reconciler/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/constituent_reconciler"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["splink.*", "pandas.*", "duckdb.*", "pdfplumber.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
