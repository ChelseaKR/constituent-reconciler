# The demo data written to an import-ready CiviCRM file instead of pushed over the
# network. This is the offline-first path: no API key, no server call. The
# pipeline writes out/civicrm_import.csv with CiviCRM import column headers
# (first_name, last_name, birth_date, email, phone) plus external_identifier, so
# you load it with CiviCRM's "Import Contacts" and match on the external
# identifier. A re-run keyed on the same identifier updates rather than duplicates.
#
#   constituent-reconcile run --config recipe-civicrm-csv.toml --out out
#
# The live API v4 push is the opt-in alternative (recipe-civicrm.toml). This file
# target stays on the machine, so the DV policy pack permits it.

[input]
existing = "existing.csv"
incoming = "incoming.csv"
id_column = "id"

[mapping]
first_name = "First Name"
last_name = "Last Name"
dob = "DOB"
email = "Email"
phone = "Phone"

[consent]
column = "Consent"

[thresholds]
prior = 0.01
auto = 0.97
review = 0.80

[output]
connector = "civicrm_csv"
external_id_field = "external_identifier"
