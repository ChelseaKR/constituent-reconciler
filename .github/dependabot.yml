# Keep the SHA-pinned actions and the Python dependencies current. Dependabot
# updates the pinned commit SHAs in workflow files rather than loosening them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
