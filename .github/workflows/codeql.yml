name: codeql

# SAST for both the Python source (SEC-08) and the workflow files themselves
# (CICD-20's "actions" language). Runs on every push/PR to main plus a weekly
# schedule so drift in the CodeQL query packs themselves still gets caught
# even on a quiet repo.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 3" # Wednesday 07:00 UTC

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload CodeQL results
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          category: "/language:${{ matrix.language }}"
