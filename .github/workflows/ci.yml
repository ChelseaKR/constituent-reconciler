name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default token; jobs widen only what they need.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to tags here for readability. Per the portfolio
      # supply-chain standard these are pinned to commit SHAs before the first
      # tagged release; tracked in docs/RESPONSIBLE-TECH-AUDITS.md.
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Drive CI through the Makefile so it runs byte for byte the same path as
      # `make verify` does locally.
      - name: Install
        run: make install
      - name: Verify (ruff, mypy --strict, pytest)
        run: make verify
      - name: Eval report is current
        run: |
          make eval
          git diff --exit-code eval/report.md
