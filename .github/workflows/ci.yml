name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run keeps the optional libpostal job exercised even when the repo
  # is quiet, so a bit-rotted build is noticed before someone needs it.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Least-privilege default token; jobs widen only what they need.
permissions:
  contents: read

# Supersede in-flight runs on the same ref (CI-CD-STANDARD §11c) — a newer
# push makes the older run's result moot, so don't spend minutes finishing it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to a full commit SHA per the portfolio supply-chain
      # standard; the trailing comment records the human-readable version.
      # v6/v8.3.0 are the node24 releases (GitHub switched the runner default
      # off node20 in 2026; node20-only actions need an explicit opt-out).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
      # Drive CI through the Makefile so it runs byte for byte the same path as
      # `make verify` does locally.
        with:
          enable-cache: true
      - name: Install
        run: make install
      - name: Verify (ruff format --check, ruff check, mypy --strict, pytest)
        run: make verify
      - name: Eval reports are current
        run: |
          make eval
          make eval-extraction
          make eval-bias
          git diff --exit-code \
            eval/report.md eval/extraction-report.md docs/audits/bias-report.md

  # Automated axe-core audit of the review queue's real rendered HTML
  # (docs/adr/0011-automated-axe-audit.md), separate from `verify` so a
  # contributor without Node installed is not blocked from the Python checks.
  # Covers the "axe clean" half of the accessibility row in the metrics
  # ledger; the "screen-reader walkthrough" half is manual and tracked in
  # docs/reviews/SCREEN-READER-WALKTHROUGH.md.
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install (Python)
        run: make install
      - name: Install (Node, frozen lockfile)
        run: npm ci
      - name: axe audit of the rendered review queue
        run: make axe

  # Dependency-vulnerability gate (SEC-11, SEC-13, CQ-11), separate from
  # `verify` so it is its own required status check and its own log/timeout.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
      - name: Install
        run: make install
      # osv-scanner has no first-party step-style action with a pinnable SHA
      # that fits this job (upstream ships it as reusable workflows with SARIF
      # + code-scanning upload); install the pinned release binary directly
      # and verify it against the published SHA256SUMS instead.
      - name: Install osv-scanner (checksum-verified)
        run: |
          set -eu
          curl -sSfL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
          echo "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          sudo mv osv-scanner /usr/local/bin/osv-scanner
      - name: pip-audit + osv-scanner (blocking, no mute pattern)
        run: make security

  # Secret scanning (SEC-17, SEC-18, CQ-12): full-history scan on every push
  # and PR. Free for personal-account repos (no GITLEAKS_LICENSE needed); see
  # https://github.com/gitleaks/gitleaks-action.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SAST (SEC-07): public Semgrep registry rulesets plus a repo-specific rule
  # (.semgrep/no-pii-in-logs.yml) mirroring the data-minimization invariants
  # tests/test_consent.py and tests/test_provenance.py already enforce for
  # committed artifacts. Runs in the upstream image pinned by digest rather
  # than a marketplace action (Semgrep ships no SHA-pinnable step action).
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep@sha256:59fbed6127ea7c5dde3ba6a85142733bb20ea9aaa36120c953904f1539aaf66e # 1.168.0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Semgrep (blocking, zero unwaived findings)
        run: |
          semgrep scan --error \
            --config p/security-audit --config p/secrets \
            --config .semgrep/no-pii-in-logs.yml \
            src tests

  # Workflow SAST (CICD-19): lints .github/workflows/** for injection, missing
  # permissions, unpinned actions, credential persistence, etc. Zero findings
  # expected; verified locally before this job was added.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # to upload the SARIF report to Code Scanning
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7

  # Container scan (SEC-28): build the self-host image exactly as a user
  # would (`make docker`) and block on any fixed CRITICAL/HIGH finding.
  # NOTE: not locally exercised during this remediation pass — no Docker
  # daemon was available in that environment; verify on the first real PR.
  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Build image
        run: make docker
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: constituent-reconciler
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # Build the offline install bundle (docs/INSTALL-OFFLINE.md): wheelhouse,
  # Docker image tarball when Docker is available, source archive, and
  # SHA256SUMS. Building here also exercises the install path documented for
  # air-gapped environments.
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # required for Sigstore keyless signing on main pushes
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
      - name: Install
        run: make install
      - name: Build bundle
        run: make bundle
      - name: Verify checksums
        run: cd dist/bundle && sha256sum -c SHA256SUMS
      - name: Sign SHA256SUMS (Sigstore keyless)
        if: github.event_name == 'push'
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: dist/bundle/SHA256SUMS
      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-bundle
          path: dist/bundle

  # Exercises the optional libpostal backend against the real C library. The
  # deterministic backend stays the default and the blocking gate; this job is
  # non-blocking and runs only on the weekly schedule (or manual dispatch),
  # never per-push (CI-CD-STANDARD §11d): the source build and trained-model
  # data download are too heavy — and advisory — for the merge path.
  libpostal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    env:
      LIBPOSTAL_COMMIT: ffafa3fcd687631955453df70906c53d5677ce9a # v1.1.4
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
      - name: Restore libpostal build and data
        id: cache-libpostal
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/libpostal
            ~/libpostal-data
          key: libpostal-${{ runner.os }}-${{ env.LIBPOSTAL_COMMIT }}
      - name: Build libpostal from source
        if: steps.cache-libpostal.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl autoconf automake libtool pkg-config
          git clone https://github.com/openvenues/libpostal.git "$HOME/libpostal"
          git -C "$HOME/libpostal" checkout "$LIBPOSTAL_COMMIT"
          cd "$HOME/libpostal"
          ./bootstrap.sh
          ./configure --datadir="$HOME/libpostal-data"
          make -j"$(nproc)"
      - name: Install libpostal
        run: |
          cd "$HOME/libpostal"
          sudo make install
          sudo ldconfig
      - name: Install project and postal binding
        run: |
          make install
          uv pip install --python .venv/bin/python postal
      # --no-cov overrides the repo-wide --cov-fail-under=85 from addopts: this
      # job runs a narrow `-k libpostal` subset, so whole-package coverage is
      # never going to clear 85% here and the gate is meaningless noise on top
      # of the actual libpostal-path assertions this job exists to run.
      - name: Run libpostal-path tests
        run: .venv/bin/python -m pytest -k libpostal --no-cov
