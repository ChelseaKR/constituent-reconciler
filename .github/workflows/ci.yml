name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default token; jobs widen only what they need.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA per the portfolio supply-chain
      # standard; the trailing comment records the human-readable version.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # Drive CI through the Makefile so it runs byte for byte the same path as
      # `make verify` does locally.
      - name: Install
        run: make install
      - name: Verify (ruff, mypy --strict, pytest)
        run: make verify
      - name: Eval report is current
        run: |
          make eval
          git diff --exit-code eval/report.md
